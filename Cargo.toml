[package]
name = "datavivid"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
description = "DataVivid - a fast standalone viewer and editor for tabular data files"
authors = ["Prevail Team, FH Steyr"]
license = "MIT"
repository = "https://github.com/FH-Prevail/DataVivid"
readme = "README.md"
keywords = ["csv", "parquet", "dataframe", "data-wrangling", "viewer"]
categories = ["gui", "science"]
build = "build.rs"

[dependencies]
anyhow = "1.0"
# "clipboard" connects copy/paste to the system clipboard and "links" lets
# hyperlinks open the browser. Without them (default-features = false) egui
# keeps a private, in-app clipboard and links do nothing.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "links", "default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.37"
# Charts. Its version tracks egui (0.38 is the release built on egui 0.37).
egui_plot = "0.38"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.18"
calamine = "0.38"
rust_xlsxwriter = "0.104"
encoding_rs = "0.8"
flate2 = "1"
regex = "1.13"
rusqlite = { version = "0.43", features = ["bundled"] }

[dependencies.polars]
version = "0.55.2"
default-features = false
features = [
    "fmt",
    "lazy",
    "csv",
    "parquet",
    "json",
    "ipc",
    "avro",
    "dtype-full",
    "temporal",
    "timezones",
    "strings",
    "regex",
    "is_in",
    "unique_counts",
    "approx_unique",
    "round_series",
    "mode",
    "replace",
    "sql",
    "decompress",
    "streaming",
    "concat_str",
    "rows",
]

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
